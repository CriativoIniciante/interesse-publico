  # Modelos para jornalistas independentes em plataformas (preencher por pessoa, com justificativa)
  - id: modelo_substack
    nome: Newsletter em Substack
    tipo: modelo
    feeds: ["https://<nome>.substack.com/feed"]
    verificado: false
    observacoes: "um registro por jornalista; guardar tambem o nome e a plataforma"
  - id: modelo_youtube
    nome: Canal de YouTube
    tipo: modelo
    feeds: ["https://www.youtube.com/feeds/videos.xml?channel_id=<ID>"]
    verificado: false
    observacoes: "so metadados e descricao; video em si nao e coletado; considerar transcricao automatica marcada como automatica"
  - id: modelo_bluesky
    nome: Conta no Bluesky
    tipo: modelo
    feeds: ["https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=<handle>"]
    verificado: false
    observacoes: "API publica sem autenticacao; Jetstream para fluxo continuo"
  - id: modelo_telegram
    nome: Canal público no Telegram
    tipo: modelo
    feeds: ["https://t.me/s/<canal>"]
    verificado: false
    observacoes: "pre-visualizacao publica em HTML; so canais publicos"

