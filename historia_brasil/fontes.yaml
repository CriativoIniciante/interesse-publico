# Lista inicial de fontes. Entra e sai por commit, com justificativa (METODO.md, 2.1).
# Sem classificação política de propósito: o arquivo publica métricas observáveis por fonte, não rótulos.
# teste: resultado do acesso em 2026-09-08, de um ambiente com proxy. Refazer na máquina de coleta.
# tipo: agencia_publica | grande_veiculo | independente | verificador | oficial | arquivo_terceiro | retrospectivo | modelo

versao: 0
testado_em: 2026-09-08
user_agent_sugerido: "arquivo-historia-brasil/0.x (+URL do repositorio; contato)"

fontes:
  # Agências públicas
  - id: agencia_brasil
    nome: Agência Brasil (EBC)
    tipo: agencia_publica
    feeds:
      - https://agenciabrasil.ebc.com.br/rss/geral/feed.xml
      - https://agenciabrasil.ebc.com.br/rss/politica/feed.xml
      - https://agenciabrasil.ebc.com.br/rss/economia/feed.xml
      - https://agenciabrasil.ebc.com.br/rss/justica/feed.xml
      - https://agenciabrasil.ebc.com.br/rss/direitos-humanos/feed.xml
      - https://agenciabrasil.ebc.com.br/rss/educacao/feed.xml
      - https://agenciabrasil.ebc.com.br/rss/internacional/feed.xml
    verificado: true
    teste: "200, rss+xml, 10 itens (geral e politica); nao existe feed 'ultimas'"
    observacoes: "conferir licenca de reuso nos termos de uso do portal"
  - id: agencia_camara
    nome: Agência Câmara de Notícias
    tipo: agencia_publica
    feeds:
      - https://www.camara.leg.br/noticias/rss/dinamico/ULTIMAS_NOTICIAS
    verificado: false
    teste: "200, rss 2.0 valido mas com 0 itens no momento do teste; conferir parametros ou usar API de Dados Abertos da Camara"
  - id: agencia_senado
    nome: Agência Senado
    tipo: agencia_publica
    feeds:
      - https://www12.senado.leg.br/noticias/rss.xml
    verificado: true
    teste: "200, atom+xml, 15 itens"

