<text x="1620" y="407.0" font-size="10.5" text-anchor="middle" fill="#52514e">Aras e Gonet fora da lista tríplice</text>
<text x="1620" y="420.0" font-size="10.5" text-anchor="middle" fill="#52514e">(2019, 2021, 2023, 2025)</text>
