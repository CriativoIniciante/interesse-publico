<text x="330" y="682.5" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0b0b0b">SENADO E CÂMARA</text>
<text x="330" y="700.5" font-size="10.5" text-anchor="middle" fill="#52514e">109 pedidos de impeachment sem despacho;</text>
<text x="330" y="713.5" font-size="10.5" text-anchor="middle" fill="#52514e">CPI do Master não lida; PEC da</text>
<text x="330" y="726.5" font-size="10.5" text-anchor="middle" fill="#52514e">Blindagem: 353 votos</text>
