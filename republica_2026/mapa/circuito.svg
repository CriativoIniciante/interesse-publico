<text x="1760" y="707.0" font-size="10.5" text-anchor="middle" fill="#52514e">cargo de confiança: 4 diretores sob</text>
<text x="1760" y="720.0" font-size="10.5" text-anchor="middle" fill="#52514e">Bolsonaro; chefe da segurança de Lula</text>
<rect x="860.0" y="725.0" width="380" height="70" rx="12" fill="#eef3fb" stroke="#0b0b0b" stroke-width="3"/>
<text x="1050" y="749.0" font-size="16" font-weight="700" text-anchor="middle" fill="#0b0b0b">STF</text>
<text x="1050" y="767.0" font-size="10.5" text-anchor="middle" fill="#52514e">5 de 10 ministros com vínculo direto com quem</text>
<text x="1050" y="780.0" font-size="10.5" text-anchor="middle" fill="#52514e">os indicou; nenhum rejeitado em 38 anos</text>
