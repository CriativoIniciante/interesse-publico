<text x="480" y="382.5" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0b0b0b">TCU E CNJ</text>
<text x="480" y="400.5" font-size="10.5" text-anchor="middle" fill="#52514e">6 de 9 do TCU escolhidos pelo Congresso;</text>
<text x="480" y="413.5" font-size="10.5" text-anchor="middle" fill="#52514e">CNJ presidido pelo STF e sem alcance</text>
<text x="480" y="426.5" font-size="10.5" text-anchor="middle" fill="#52514e">sobre ele</text>
<rect x="815.0" y="1048.5" width="470" height="83" rx="12" fill="#fff8e6" stroke="#0b0b0b" stroke-width="1.6"/>
<text x="1050" y="1072.5" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0b0b0b">BANCOS E EMPRESAS COM CAUSAS NA CORTE</text>
<text x="1050" y="1090.5" font-size="10.5" text-anchor="middle" fill="#52514e">Fórum de Lisboa: 64 grupos; Master: 5 eventos, 4</text>
<text x="1050" y="1103.5" font-size="10.5" text-anchor="middle" fill="#52514e">famílias de ministros pagas; 1.860 processos com</text>
<text x="1050" y="1116.5" font-size="10.5" text-anchor="middle" fill="#52514e">parentes</text>
<rect x="1290" y="840" width="480" height="154" rx="8" fill="#eef3fb" stroke="#2a78d6" stroke-width="1.6"/>
<text x="1304" y="862" font-size="12" font-weight="700" letter-spacing="1" fill="#2a78d6">AS REGRAS QUE A CORTE ESCREVEU PARA SI</text>
<text x="1304" y="884" font-size="11.5" fill="#0b0b0b">• impedimento por escritório do cônjuge derrubado (7 a 4, 2023)</text>
<text x="1304" y="904" font-size="11.5" fill="#0b0b0b">• inquérito das fake news aberto de ofício e mantido por 7 anos</text>
<text x="1304" y="924" font-size="11.5" fill="#0b0b0b">• foro ampliado para depois do cargo (7 a 4, 2025)</text>
<text x="1304" y="944" font-size="11.5" fill="#0b0b0b">• provas da Odebrecht anuladas erga omnes (monocrática, 2023)</text>
<text x="1304" y="964" font-size="11.5" fill="#0b0b0b">• lei do impeachment de ministros suspensa (monocrática, 2025)</text>
<text x="1304" y="984" font-size="11.5" fill="#0b0b0b">• 80,5% das decisões monocráticas; 3,6% derrubadas pelo plenário</text>
